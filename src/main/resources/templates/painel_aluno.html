<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Minha ficha')}"></head>
<body>

<header th:replace="~{fragments/header :: header(${usuario}, 'painel')}"></header>

<main class="pagina">
    <div class="pagina-cabecalho">
        <h1 class="titulo-display" th:text="'Olá, ' + ${#strings.arraySplit(usuario.nome, ' ')[0]}">Olá</h1>
        <p>Sua ficha de treino e seu plano alimentar ficam aqui. Quando o profissional atualizar, você vê na hora.</p>
    </div>

    <div class="aluno-grade">
        <section class="ficha" aria-labelledby="titulo-treino">
            <div class="ficha-topo">
                <strong id="titulo-treino">Ficha de treino</strong>
            </div>
            <div id="meu-treino"
                 th:attr="data-tem-treinador=${usuario.meuTreinadorId != null}">
                <p class="ficha-vazia">Carregando sua ficha…</p>
            </div>
        </section>

        <section class="dieta" aria-labelledby="titulo-dieta">
            <div class="ficha-topo">
                <strong id="titulo-dieta">Plano alimentar</strong>
            </div>
            <div id="minha-dieta" class="dieta-texto"
                 th:attr="data-tem-nutricionista=${usuario.meuNutricionistaId != null}">
                <span class="texto-espera">Carregando…</span>
            </div>
        </section>
    </div>
</main>

<script th:src="@{/painel_aluno.js}"></script>
<script th:src="@{/theme-toggle.js}"></script>
</body>
</html>
