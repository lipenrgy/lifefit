<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<!-- <head> comum a todas as páginas -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' — LifeFit'">LifeFit</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
    <link rel="stylesheet" th:href="@{/lifefit.css}">
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches))
                document.documentElement.classList.add('dark-mode');
        })();
    </script>
</head>

<body>

<!-- Marca: barra com anilhas + nome -->
<a th:fragment="marca" th:href="@{/}" class="wordmark">
    <svg viewBox="0 0 30 22" aria-hidden="true">
        <rect class="barra" x="0" y="10" width="30" height="2" rx="1"/>
        <rect class="anilha-1" x="3" y="1" width="5" height="20" rx="1.5"/>
        <rect class="anilha-2" x="9" y="4" width="3.5" height="14" rx="1.2"/>
        <rect class="anilha-2" x="17.5" y="4" width="3.5" height="14" rx="1.2"/>
        <rect class="anilha-1" x="22" y="1" width="5" height="20" rx="1.5"/>
    </svg>
    LifeFit
</a>

<!-- Foto do usuário ou a inicial do nome -->
<th:block th:fragment="avatar(u)">
    <img th:if="${u.foto != null}" class="avatar" th:src="@{'/uploads/' + ${u.foto}}" alt="">
    <span th:unless="${u.foto != null}" class="avatar avatar-iniciais" aria-hidden="true"
          th:text="${#strings.toUpperCase(#strings.substring(u.nome, 0, 1))}">A</span>
</th:block>

<!-- Chave de tema claro/escuro (theme-toggle.js usa o #checkbox-theme) -->
<label th:fragment="tema" class="tema" for="checkbox-theme">
    <input type="checkbox" id="checkbox-theme">
    <span class="tema-trilho" aria-hidden="true"></span>
    <span class="tema-texto">Tema escuro</span>
</label>

<!-- Topo da área logada. ativo: 'painel', 'chat' ou 'config' -->
<header th:fragment="header(usuario, ativo)" class="app-topo">
    <a th:replace="~{fragments/header :: marca}"></a>

    <nav class="app-nav" aria-label="Principal">
        <a th:href="${usuario.tipo == 'aluno'} ? @{/aluno/painel} : @{/treinador/painel}"
           th:attr="aria-current=${ativo == 'painel'} ? 'page' : null"
           th:text="${usuario.tipo == 'aluno'} ? 'Minha ficha' : 'Meus alunos'">Painel</a>
        <a th:href="@{/chat}" th:attr="aria-current=${ativo == 'chat'} ? 'page' : null">Chat</a>
        <a th:href="@{/configuracoes}" th:attr="aria-current=${ativo == 'config'} ? 'page' : null">Configurações</a>
    </nav>

    <div class="app-acoes">
        <label th:replace="~{fragments/header :: tema}"></label>
        <div class="app-usuario">
            <th:block th:replace="~{fragments/header :: avatar(${usuario})}"></th:block>
            <span th:text="${usuario.nome}">Nome</span>
        </div>
        <form th:action="@{/logout}" method="POST">
            <button type="submit" class="btn-texto">Sair</button>
        </form>
    </div>
</header>

</body>
</html>
