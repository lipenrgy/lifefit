<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Chat')}"></head>
<body>

<header th:replace="~{fragments/header :: header(${usuario}, 'chat')}"></header>

<main class="chat">
    <nav class="chat-contatos" aria-labelledby="titulo-conversas">
        <h1 id="titulo-conversas">Conversas</h1>
        <div id="lista-contatos">
            <p class="placeholder-col">Carregando…</p>
        </div>
    </nav>

    <section class="chat-main" aria-labelledby="nome-destinatario">
        <div class="chat-header">
            <h2 id="nome-destinatario">Nenhuma conversa aberta</h2>
        </div>

        <div class="chat-messages" id="chat-messages" aria-live="polite">
            <p class="empty-state">Escolha alguém na lista para ver a conversa.</p>
        </div>

        <form class="chat-input-area hidden" id="form-mensagem">
            <input type="hidden" id="id-destinatario-atual">
            <label class="visualmente-oculto" for="input-mensagem">Mensagem</label>
            <input type="text" id="input-mensagem" class="entrada" placeholder="Escreva uma mensagem" autocomplete="off">
            <button type="submit" class="btn btn-primario">Enviar</button>
        </form>
    </section>
</main>

<script th:src="@{/chat.js}"></script>
<script th:src="@{/theme-toggle.js}"></script>
</body>
</html>
