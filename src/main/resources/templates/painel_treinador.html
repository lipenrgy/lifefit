<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Meus alunos')}"></head>
<body th:with="ehTreinador=${usuario.tipo == 'treinador'}">

<input type="hidden" id="tipo-usuario-logado" th:value="${usuario.tipo}">
<header th:replace="~{fragments/header :: header(${usuario}, 'painel')}"></header>

<main class="prof-grade" th:classappend="${ehTreinador} ? '' : 'prof-grade-nutri'">

    <!-- ALUNOS -->
    <section class="prof-coluna" aria-labelledby="titulo-alunos">
        <div class="prof-coluna-topo">
            <h1 id="titulo-alunos">Meus alunos</h1>
            <p>Quem escolheu você</p>
        </div>
        <div class="prof-rolagem">
            <ul id="alunos-ul">
                <li class="sem-alunos">Carregando…</li>
            </ul>
        </div>
    </section>

    <!-- CATÁLOGO DE EXERCÍCIOS (só treinador) -->
    <section th:if="${ehTreinador}" class="prof-coluna" aria-labelledby="titulo-exercicios">
        <div class="prof-coluna-topo">
            <h2 id="titulo-exercicios">Exercícios</h2>
            <p>Clique para adicionar à ficha</p>
            <div class="ex-filtros">
                <label class="visualmente-oculto" for="busca-exercicio">Buscar exercício</label>
                <input type="search" id="busca-exercicio" class="entrada" placeholder="Buscar exercício" disabled>
                <label class="visualmente-oculto" for="filtro-categoria">Grupo muscular</label>
                <select id="filtro-categoria" class="entrada" disabled>
                    <option value="Todos">Todos os grupos</option>
                    <option>Peito</option>
                    <option>Costas</option>
                    <option>Pernas</option>
                    <option>Ombros</option>
                    <option>Bíceps</option>
                    <option>Tríceps</option>
                    <option>Abdômen</option>
                    <option>Cardio</option>
                </select>
            </div>
        </div>
        <div id="lista-exercicios" class="prof-rolagem">
            <p class="placeholder-col">Selecione um aluno para montar a ficha.</p>
        </div>
    </section>

    <!-- PLANO DO ALUNO -->
    <section class="prof-coluna" aria-labelledby="aluno-selecionado-nome">
        <div class="prof-coluna-topo">
            <h2 id="aluno-selecionado-nome" th:text="${ehTreinador} ? 'Ficha do aluno' : 'Plano alimentar'">Ficha do aluno</h2>
            <dl id="dados-aluno-grid" class="dados-aluno hidden"></dl>
        </div>

        <input type="hidden" id="aluno-id-hidden">

        <p id="placeholder-plano" class="placeholder-col">
            Selecione um aluno na lista para ver os dados físicos e
            <span th:text="${ehTreinador} ? 'montar a ficha.' : 'escrever o plano alimentar.'"></span>
        </p>

        <div id="form-plano" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
            <div th:if="${ehTreinador}" id="plano-atual" class="prof-rolagem"></div>

            <div th:unless="${ehTreinador}" class="prof-rolagem" style="display:flex">
                <label class="visualmente-oculto" for="dieta-texto">Plano alimentar</label>
                <textarea id="dieta-texto" class="dieta-editor"
                          placeholder="Café da manhã (7h)&#10;2 ovos mexidos, 1 pão integral, 1 fruta&#10;&#10;Almoço (12h)&#10;..."></textarea>
            </div>

            <div class="prof-rodape">
                <p id="status-plano" aria-live="polite">As mudanças só valem para o aluno depois de salvar.</p>
                <button id="btn-salvar-plano" class="btn btn-primario"
                        th:text="${ehTreinador} ? 'Salvar ficha' : 'Salvar plano alimentar'">Salvar ficha</button>
            </div>
        </div>
    </section>
</main>

<script th:src="@{/painel_treinador.js}"></script>
<script th:src="@{/theme-toggle.js}"></script>
</body>
</html>
